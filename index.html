<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#101211"><meta name="description" content="A birthday celebration."><title>A birthday celebration</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cinema.css"><link rel="stylesheet" href="story.css"><link rel="stylesheet" href="submissions.css?v=20260919-submit"><script src="event-config.js?v=20260919-copy3" defer></script><script src="cinema.js?v=20260919-copy3" defer></script><script src="vendor/supabase.js" defer></script><script src="submissions.js?v=20260919-submit" defer></script><script src="script.js?v=20260919-submit" defer></script><script src="music.js" defer></script><script src="story.js" defer></script></head><body>
<noscript><p style="padding:24px;color:#f3ead7">Please enable JavaScript to open this invitation. / Slå på JavaScript for å åpne invitasjonen.</p></noscript>
<article id="gatsby-invitation" lang="en" data-direction="gala" data-ornament="deco" aria-label="Birthday invitation">
  <button class="party-music-toggle cursor-interaction" type="button" data-music-toggle aria-pressed="false" aria-label="Turn sound on" hidden><span aria-hidden="true">♫</span><span data-music-label>Sound off</span></button>
  <audio data-background-music preload="none" hidden></audio>
  <p class="party-sound-status" data-music-status role="status" hidden></p>
  <main class="party-story" id="invitation" tabindex="-1">
    <div class="story-toolbar">
      <p class="story-brand" data-story-copy="edition"></p>
      <div class="party-language" role="group" aria-label="Language / Språk"><button type="button" lang="en" data-language="en" aria-pressed="true">English</button><button type="button" lang="nb" data-language="nb" aria-pressed="false">Norsk</button></div>
    </div>
    <section class="story-chapter" id="party-when" aria-labelledby="when-title">
      <div class="story-card">
        <p class="story-kicker"><span class="story-number">01</span><span data-story-copy="whenKicker"></span></p>
        <h2 class="story-title" id="when-title" data-story-copy="whenTitle"></h2>
        <p class="story-intro" data-story-copy="whenIntro"></p>
        <div class="party-facts">
          <div class="party-fact"><p class="party-kicker" data-i18n="when"></p><p class="party-fact-value" data-event-date></p></div>
          <div class="party-fact"><p class="party-kicker" data-i18n="where"></p><p class="party-fact-value"><span data-street></span><br><span data-town></span>, <span data-country></span></p></div>
        </div>
        <a class="party-map" data-map-link target="_blank" rel="noopener noreferrer" data-i18n="map"></a>
        <div class="story-detail-actions">
          <button type="button" data-dialog-open="dress-dialog" data-story-copy="dressAction"></button>
          <button type="button" data-dialog-open="food-dialog" data-story-copy="foodAction"></button>
        </div>
        <a class="story-next" href="#party-rsvp"><span data-story-copy="toRsvp"></span><span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section class="story-chapter" id="party-rsvp" aria-labelledby="rsvp-title">
      <div class="story-card party-rsvp">
        <p class="story-kicker"><span class="story-number">02</span><span data-story-copy="rsvpKicker"></span></p>
        <h2 class="story-title" id="rsvp-title" data-story-copy="rsvpTitle"></h2>
        <p class="story-intro" data-story-copy="rsvpIntro"></p>
        <form id="party-rsvp-form">
        <label for="party-guest-name" data-i18n="guestName"></label>
        <input id="party-guest-name" name="guestName" type="text" autocomplete="name" maxlength="120" required>
        <div class="party-rsvp-choices"><button class="cursor-interaction" type="submit" name="reply" value="yes" data-i18n="rsvpYes"></button><button class="cursor-interaction" type="submit" name="reply" value="no" data-i18n="rsvpNo"></button></div>
        <p class="party-rsvp-note" data-i18n="rsvpNote"></p>
        <p class="party-rsvp-note" data-rsvp-status role="status" aria-live="polite"></p>
      </form>
      </div>
    </section>
    <section class="story-chapter" id="party-evidence" aria-labelledby="party-contribute-title" hidden>
      <div class="story-card party-contribute">
        <p class="story-kicker"><span class="story-number">03</span><span data-story-copy="evidenceKicker"></span></p>
        <h2 class="story-title" id="party-contribute-title" data-i18n="contributeTitle"></h2>
        <p class="story-intro" data-i18n="contributeIntro"></p>
        <p class="story-contributor"><span data-story-copy="from"></span> <strong data-contributor-name></strong></p>
        <form id="party-contribution-form">

        <input id="party-contributor" name="contributor" type="hidden">
        <label for="party-story" data-i18n="storyLabel"></label>
        <textarea id="party-story" name="story" rows="5" maxlength="3000" required aria-describedby="party-story-hint"></textarea>
        <p class="party-field-hint" id="party-story-hint" data-i18n="storyHint"></p>
        <label for="party-photos" data-i18n="photosLabel"></label>
        <input id="party-photos" name="photos" type="file" accept="image/*" multiple aria-describedby="party-photos-hint party-photo-error">
        <p class="party-field-hint" id="party-photos-hint" data-i18n="photosHint"></p>
        <p class="party-field-error" id="party-photo-error" role="alert"></p>
        <div class="party-photo-previews" data-photo-previews></div>
        <button class="party-small-button cursor-interaction" type="submit" data-i18n="contributeButton"></button>
        <p class="party-field-hint" data-i18n="contributeNote"></p>
        <p class="party-contribution-status" data-contribution-status role="status" aria-live="polite"></p>
      </form>
        <a class="story-next" href="#party-memories"><span data-story-copy="toAlbum"></span><span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section class="story-chapter" id="party-memories" aria-labelledby="album-title">
      <div class="story-card party-album">
        <p class="story-kicker"><span class="story-number">04</span><span data-story-copy="albumKicker"></span></p>

      <div class="party-album-head"><div><h2 class="story-title" id="album-title" data-i18n="albumTitle"></h2></div><span class="party-paging" data-page-count aria-live="polite">01 / 03</span></div>
      <div class="party-collage">
        <button class="party-memory cursor-interaction" type="button" data-memory="0"><img alt=""><span></span></button>
        <button class="party-memory cursor-interaction" type="button" data-memory="1"><img alt=""><span></span></button>
        <button class="party-memory cursor-interaction" type="button" data-memory="2"><img alt=""><span></span></button>
      </div>
      <div class="party-photo-view" hidden><img alt="" data-large-photo><p data-photo-caption></p></div>
      <div class="party-album-controls"><p data-i18n="albumHint"></p><button class="party-small-button cursor-interaction" type="button" data-next-page>More memories →</button><button class="party-small-button cursor-interaction" type="button" data-close-photo hidden>Back to the album</button></div>

      </div>
    </section>
    <p class="party-signoff" data-signoff></p>
    <dialog class="story-dialog" id="dress-dialog" aria-label="Dress code"><button type="button" class="story-dialog-close" data-dialog-close aria-label="Close">×</button><section class="party-section" id="party-dress">
        <h3 data-i18n="dressTitle"></h3>
        <p data-i18n="dressBody"></p>
        <div class="party-dress-words"><span data-i18n="dress1"></span><span data-i18n="dress2"></span><span data-i18n="dress3"></span></div>
      </section></dialog>
    <dialog class="story-dialog" id="food-dialog" aria-label="Food and drinks"><button type="button" class="story-dialog-close" data-dialog-close aria-label="Close">×</button><section class="party-permit">
      <div class="party-permit-head"><div><p class="party-kicker" data-i18n="drinksKicker"></p><h3 data-i18n="drinksTitle"></h3></div></div>
      <p class="party-permit-copy" data-i18n="drinksHistory"></p>
      <p class="party-permit-copy"><strong data-i18n="food"></strong> <span data-i18n="byob"></span></p>
    </section></dialog>
  </main>
</article>
</body></html>
